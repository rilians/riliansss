name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run browser tests
        run: |
          set -o pipefail
          if npm run test:e2e 2>&1 | tee /tmp/portfolio-e2e.log; then
            exit 0
          else
            details=$(tail -n 100 /tmp/portfolio-e2e.log)
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error title=Browser tests failed::$details"
            exit 1
          fi
